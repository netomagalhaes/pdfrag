services:
  - type: web
    name: pdf-rag-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: APP_NAME
        value: "PDF RAG API"
      - key: APP_VERSION
        value: "1.0.0"
      - key: CHUNK_SIZE
        value: "2000"
      - key: CHUNK_OVERLAP
        value: "500"
      - key: TOP_K_DEFAULT
        value: "4"
      - key: SIMILARITY_THRESHOLD
        value: "0.7"
      - key: OPENAI_MODEL
        value: "gpt-3.5-turbo"
      - key: CHROMA_COLLECTION_NAME
        value: "pdf_rag_collection"
      - key: BASE_DIR
        value: "base"
      - key: DB_DIR
        value: "db"
      # Variáveis sensíveis - devem ser configuradas no dashboard do Render
      - key: OPENAI_API_KEY
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
    disk:
      name: pdf-rag-storage
      mountPath: /opt/render/project/backend
      sizeGB: 1
